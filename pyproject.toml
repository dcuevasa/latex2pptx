[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2pptx"
version = "1.0.0"
description = "A reliable CLI tool to convert complex LaTeX Beamer slides into faithful, editable PowerPoint presentations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "lxml>=4.9.0",
]

[project.scripts]
latex2pptx = "latex2pptx.cli:main"
